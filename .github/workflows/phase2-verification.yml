name: Sooda Phase 2 Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository has no runtime database artifacts
        shell: bash
        run: |
          set -euo pipefail
          matches="$(find . -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -not -path './node_modules/*' -not -path './.git/*' -print)"
          test -z "$matches"

      - name: Verify stale Phase 2 statuses are absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='*.lock' -E '\b(PAUSED|ARCHIVED)\b' .

      - name: Verify predictable dev credentials are absent from source
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.git --exclude-dir=node_modules -E 'token_(albaraka_owner|albaraka_staff|nilecrafts_owner|platform_admin)|DEV_TEST_PRINCIPALS_FIXTURE' .

      - name: Run full regression suite
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Inspect production bundle for dev authentication fixtures
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          ! grep -RIn -E 'token_(albaraka_owner|albaraka_staff|nilecrafts_owner|platform_admin)|DEV_TEST_PRINCIPALS_FIXTURE' dist

      - name: Package release
        run: npm run package

      - name: Inspect release artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          z = Path('release.zip')
          assert z.exists(), 'release.zip was not created'
          with zipfile.ZipFile(z) as archive:
              names = archive.namelist()
              forbidden = [n for n in names if n.endswith(('.db','.sqlite','.sqlite3')) or Path(n).name == 'sooda.db']
              assert not forbidden, f'Database artifacts found in release: {forbidden}'
              text_names = [n for n in names if n.endswith(('.js','.mjs','.cjs','.ts','.tsx','.json','.md','.html'))]
              leaked = []
              needles = ('token_albaraka_owner','token_albaraka_staff','token_nilecrafts_owner','token_platform_admin','DEV_TEST_PRINCIPALS_FIXTURE')
              for name in text_names:
                  data = archive.read(name).decode('utf-8', errors='ignore')
                  if any(x in data for x in needles):
                      leaked.append(name)
              assert not leaked, f'Dev authentication fixtures found in release: {leaked}'
          print('FINAL RELEASE ARTIFACT: CLEAN')
          PY
